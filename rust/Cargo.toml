[package]
name = "rust_lib_mofu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
async-compat = "0.2.5"
async-global-executor = "3.1.0"
cpal = "0.18.1"
directories = "6.0.0"
flume = { version = "0.12.0", features = ["async"] }
flutter_rust_bridge = "=2.12.0"
rand = "0.10.2"
rubato = "4.0.0"
rtrb = "0.3.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
souvlaki = "0.8.3"
symphonia = { version = "0.6.0", features = ["all"] }
thiserror = "2.0.19"
futures-timer = "3.0.4"
toasty = { version = "0.9.0", features = ["turso"] }
toasty-driver-turso = "0.9.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
rfd = "0.17.2"

[dev-dependencies]
futures-util = "0.3.33"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
