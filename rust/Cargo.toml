[package]
name = "rust_lib_mofu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cpal = "0.18.1"
crossbeam-channel = "0.5.16"
deadpool = { version = "0.13.0", features = ["managed", "rt_smol_2"], default-features = false }
directories = "6.0.0"
flutter_rust_bridge = "=2.12.0"
rand = "0.10.2"
rubato = "4.0.0"
rtrb = "0.3.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol = "2.0.2"
souvlaki = "0.8.3"
symphonia = { version = "0.6.0", features = ["all"] }
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
turso = "0.7.2"
walkdir = "2.5.0"

[dev-dependencies]
futures-executor = "0.3.33"
futures-util = "0.3.33"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
